  <rect x="3.1" y="4.6" width="4.2" height="3.4" rx="1.1" fill="#55637A"/>
  <rect x="8.7" y="4.6" width="4.2" height="3.4" rx="1.1" fill="#55637A"/>
  <rect x="3.1" y="9.8" width="4.2" height="3.4" rx="1.1" fill="#26B277"/>
  <rect x="8.7" y="9.8" width="4.2" height="3.4" rx="1.1" fill="#26B277"/>
</svg>
