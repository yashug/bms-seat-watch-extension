<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seat Watch</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 384px; }

  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--edge);
  }
  .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--open); flex: none; }
  .pip.paused { background: var(--free); }
  .bar .eyebrow { flex: 1; }
  .bar .count { color: var(--ink-3); }

  .shows { max-height: 486px; overflow-y: auto; }
  .shows::-webkit-scrollbar { width: 8px; }
  .shows::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 4px; }

  .show { padding: 14px 14px 13px; border-bottom: 1px solid var(--edge);
          background: var(--card); }
  .show:last-child { border-bottom: 0; }

  /* Which show, and the way there — the two things you open this for, on one
     line. The header is also what stays put when a tall card scrolls. The
     button clears the title only, so the venue and showtime keep full width. */
  .head { display: flex; align-items: center; gap: 10px; }
  .head .open { flex: none; padding: 7px 11px; font-size: 12px; }

  .name {
    flex: 1; min-width: 0;                 /* min-width lets the title ellipsize */
    margin: 0; font: 650 15px/1.25 var(--sans); letter-spacing: -.012em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .venue { margin-top: 5px; color: var(--ink-2); font-size: 11.5px;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- the hall ------------------------------------------------------- */
  .hall { position: relative; margin: 11px 0 15px; }
  /* Above the screen glow, so the light shows through the gaps between seats
     instead of washing across them. The seats are the data; they stay crisp. */
  .map { display: block; margin: 0 auto; position: relative; z-index: 1; }
  .hall .beam--bottom { margin-top: 9px; }
  .hall .beam--bottom::before { z-index: 0; }
  .caption { display: flex; justify-content: center; gap: 12px; margin-top: 11px; }
  .caption span { display: flex; align-items: center; gap: 5px; }
  .caption i { width: 6px; height: 6px; border-radius: 1.5px; flex: none; }
  .caption .off { opacity: .38; }   /* nothing matched — don't flag an empty count */
  /* The counts above name the quantity, so the trend needs no axes or legend. */
  .trend { display: block; margin: 8px auto 0; }

  /* --- countdown ------------------------------------------------------ */
  /* The bar underneath is the wait for the next check, so it sits directly
     under the number it belongs to. */
  .clockline { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 7px; }
  .clock .num { --num-size: 27px; display: block; color: var(--open); margin-bottom: 6px; }
  .next { margin-left: auto; text-align: right; }
  .next .num { --num-size: 13px; display: block; color: var(--ink-2); margin-bottom: 5px; }
  .track { height: 2px; background: var(--sunk); border-radius: 2px; overflow: hidden;
           margin-bottom: 13px; }
  .track i { display: block; height: 100%; background: var(--free); border-radius: 2px;
             transition: width .4s linear; }

  /* --- blocks --------------------------------------------------------- */
  .blocks { list-style: none; margin: 0 0 11px; padding: 0;
            display: flex; flex-direction: column; gap: 5px; }
  .blocks li {
    display: grid; grid-template-columns: 18px 1fr auto auto; align-items: center; gap: 9px;
    padding: 8px 11px; border-radius: 7px;
    background: var(--open-2); border: 1px solid rgba(23, 145, 92, .22);
    font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums;
  }
  .blocks .rowid { color: var(--open); font-weight: 650; }
  .blocks .star { color: var(--open); font-size: 10px; }
  .blocks .price { color: var(--ink-2); }

  .quiet-line { color: var(--ink-2); font-size: 12px; margin-bottom: 11px; }
  /* Says what is still happening, not just what stopped — checks continue. */
  .napping { color: var(--ink-2); font-size: 12px; margin-bottom: 11px;
             padding: 7px 10px; border-radius: 7px; background: var(--sunk); }
  .err { color: var(--bad); font-size: 12px; margin-bottom: 11px; line-height: 1.45; }

  /* Quiet, and kept away from Book now — an infrequent, destructive action
     should never sit adjacent to the one you reach for in a hurry. */
  .tail { display: flex; align-items: center; gap: 4px; }
  .tail .stamp { flex: 1; min-width: 0;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hush, .drop { flex: none; font-size: 11.5px; padding: 5px 8px; }
  .drop.is-confirm { color: var(--bad); border-color: var(--bad); background: transparent; }

  /* --- empty ---------------------------------------------------------- */
  .empty { padding: 26px 18px 24px; text-align: center; }
  .empty h2 { margin: 16px 0 6px; font: 650 14px/1.3 var(--sans); }
  .empty p { margin: 0 0 16px; color: var(--ink-2); font-size: 12px; line-height: 1.55; }
  .empty b { color: var(--open); font-weight: 700; }

  /* --- footer --------------------------------------------------------- */
  .foot { display: flex; gap: 7px; padding: 11px 14px;
          border-top: 1px solid var(--edge); background: var(--card); }
  .foot .go { flex: 1; }
</style>
</head>
<body>
  <div class="bar">
    <span class="pip" id="pip"></span>
    <span class="eyebrow" id="mode">Watching</span>
    <span class="eyebrow count" id="tally"></span>
  </div>

  <div class="shows" id="shows"></div>

  <div class="foot">
    <button class="go" id="check">Check now</button>
    <button id="toggle">Pause</button>
    <button id="opts">Settings</button>
  </div>

<script src="popup.js"></script>
</body>
</html>
